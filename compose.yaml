name: homehub
services:
  homehub:
    image: ${HOMEHUB_IMAGE:-homehub-portal:1.1.3}
    build: .
    container_name: homehub
    user: "1000:1000"
    restart: unless-stopped
    ports:
      - "127.0.0.1:48080:8080"
    environment:
      HOMEHUB_ORIGIN: "https://homehub.stream:8443"
      HOMEHUB_COOKIE_SECURE: "true"
      HOMEHUB_DATA: /data
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 256M
          pids: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
