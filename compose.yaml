name: homehub
services:
  homehub:
    # 发布工具会把这一行改写为不可变标签 `homehub-portal:<版本>-<Git commit>`；
    # 手动部署时也可用 .env 里的 HOMEHUB_IMAGE 覆盖（复制 .env.example 开始）。
    image: ${HOMEHUB_IMAGE:-homehub-portal:1.8.0}
    build: .
    container_name: homehub
    user: "1000:1000"
    restart: unless-stopped
    ports:
      # 仅回环监听：HTTPS 反向代理（如 OpenResty / Caddy / Nginx）负责对外 TLS。
      # 如需直接暴露，请自行修改并理解 HOMEHUB_ORIGIN / HOMEHUB_COOKIE_SECURE 的含义。
      - "127.0.0.1:48080:8080"
    environment:
      # 必须与浏览器实际访问的对外源（scheme + 域名 + 端口）完全一致，用于跨站防护。
      HOMEHUB_ORIGIN: ${HOMEHUB_ORIGIN:-https://homehub.stream:8443}
      # 生产必须为 true（Secure Cookie）。仅 HTTP 本地预览时可置 false。
      HOMEHUB_COOKIE_SECURE: ${HOMEHUB_COOKIE_SECURE:-true}
      HOMEHUB_DATA: /data
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 256M
          pids: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  collector:
    # 星轨观测站：与门户同镜像、不同入口；只读挂载宿主机计数器与 Docker socket。
    # 无对外端口，仅在 compose 内网由门户代理；历史数据落在 ./data/collector。
    image: ${HOMEHUB_IMAGE:-homehub-portal:1.8.0}
    command: python /app/collector.py
    container_name: homehub-collector
    user: "0:0"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9100/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    environment:
      # 公网域名在 NAT 回环下往往探测失败；改走内网反代入口并保留原 Host 头。
      HOMEHUB_COLLECTOR_PROBE_VIA: 10.0.1.2:8443
    volumes:
      # /sys/fs/cgroup 的只读 bind mount 直接暴露宿主 cgroup 树（bind 在宿主侧
      # 解析路径，与容器自身的 cgroup namespace 无关），无需 cgroupns: host。
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/host/sys:ro
      - /sys/fs/cgroup:/host/cgroup:ro
      - /:/host/root:ro
      - /vol1:/vol1:ro
      - /vol2:/vol2:ro
      - /vol3:/vol3:ro
      - ./data/collector:/data/collector
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 384M
          pids: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
